<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Platformer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/phaser.min.js"></script>
</head>
<body>
  <div class="hud">
    <h1>Cat Platformer</h1>
    <p>Tastatur: Pfeile oder A/D + Leertaste/W/Oben. Handy: links ziehen zum Laufen, nach oben wischen zum Springen.</p>
  </div>
  <dialog id="resumeDialog" class="run-dialog" aria-labelledby="resumeTitle" aria-describedby="resumeSummary">
    <h2 id="resumeTitle">Lauf fortsetzen?</h2>
    <p id="resumeSummary"></p>
    <div class="run-dialog__actions">
      <button id="newRunButton" type="button" class="secondary">Neuer Lauf</button>
      <button id="resumeRunButton" type="button">Fortsetzen</button>
    </div>
  </dialog>
  <div id="game"></div>
  <script src="src/run-storage.js"></script>
  <script src="src/level-generator.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
